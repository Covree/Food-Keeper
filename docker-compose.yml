services:
  mysql:
    image: mysql:8.4
    container_name: foodkeeper-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-food_keeper}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      TZ: America/Sao_Paulo
    ports:
      # Porta do HOST (acesso por DBeaver/Workbench). Dentro do Docker o MySQL
      # continua em 3306. Mude MYSQL_HOST_PORT no .env se 3307 também estiver ocupada.
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - foodkeeper_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: .
    container_name: foodkeeper-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      TZ: America/Sao_Paulo
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m}

      # --- server ---
      SERVER_PORT: 8080
      SERVER_ERROR_INCLUDE_MESSAGE: never
      SERVER_ERROR_INCLUDE_STACKTRACE: never

      # --- spring ---
      SPRING_APPLICATION_NAME: food-keeper-backend

      # --- datasource (o host é o nome do serviço: "mysql") ---
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-food_keeper}?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver

      # --- jpa / hibernate ---
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE: America/Sao_Paulo

      # --- flyway ---
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

      # --- swagger ---
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui.html
      SPRINGDOC_SWAGGER_UI_PERSIST_AUTHORIZATION: "true"

      # --- jwt ---
      SECURITY_JWT_SECRET: ${JWT_SECRET:-foodkeeper-development-secret-change-me-2026-very-long}
      SECURITY_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}

      # --- aplicação ---
      FOODKEEPER_ALERTS_CRON: "${ALERTS_CRON:-0 0 * * * *}"
      FOODKEEPER_SEED_ADMIN_ENABLED: ${SEED_ADMIN_ENABLED:-false}
      FOODKEEPER_SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
      FOODKEEPER_SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@foodkeeper.local}
      FOODKEEPER_SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

  frontend:
    build:
      context: ./food-keeper-frontend
      args:
        VITE_API_URL: /api
    container_name: foodkeeper-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  foodkeeper_mysql_data:
